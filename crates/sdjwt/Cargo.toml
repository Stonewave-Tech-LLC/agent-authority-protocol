[package]
name = "aap-sdjwt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SD-JWT (RFC 9901), key binding and Delegate SD-JWT chains for the Agent Authority Protocol. Format only, no policy."

[dependencies]
serde_json.workspace = true
ed25519-dalek.workspace = true
p256.workspace = true
rand.workspace = true
base64.workspace = true
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
# Differential cross-check only: an independent, maintained RFC 9901
# implementation must agree with ours on every vector. Never a runtime
# dependency — the trust path stays in this crate.
sd-jwt-payload = "0.5.1"
async-trait = "0.1"
pollster = "0.4"
