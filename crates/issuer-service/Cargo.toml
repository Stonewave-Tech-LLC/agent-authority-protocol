[package]
name = "aap-issuer-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Issuer Service: enrolls users' devices (App Attest + principal-key proof of possession) and binds mandates to the attested app instance via App Attest assertions."

[lib]
name = "aap_issuer_service"
path = "src/lib.rs"

[[bin]]
name = "aap-issuer-service"
path = "src/main.rs"

[dependencies]
aap-core = { path = "../core" }
axum = "0.8"
base64.workspace = true
chrono.workspace = true
ciborium = "0.2"
deadpool-postgres = "0.14"
p256.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
tower-http = { version = "0.6", features = ["timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid.workspace = true
x509-parser = { version = "0.16", features = ["verify"] }

[dev-dependencies]
http-body-util = "0.1"
p256 = { workspace = true, features = ["pkcs8"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tower = { version = "0.5", features = ["util"] }
